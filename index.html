<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Лицей</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB;--sur:#fff;--s2:#F0F2F8;--s3:#E8ECF4;
  --pri:#5B8EF0;--pli:#EEF3FE;--pda:#3A6CD4;
  --acc:#F5A623;--grn:#34C0A0;--vio:#9B59B6;
  --dan:#F05B5B;--war:#F5A623;
  --tx:#1A1D2E;--t2:#6B7280;--t3:#A0A9B8;
  --bor:#E8ECF4;
  --sh:0 2px 16px rgba(91,142,240,.10);
  --sh2:0 4px 32px rgba(91,142,240,.16);
  --r:20px;--rsm:12px;
  --nav:68px;--top:60px;
  --font:'Nunito',sans-serif;--fdi:'Unbounded',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--tx);-webkit-tap-highlight-color:transparent;}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden;}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.active{display:flex;}
.sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sb::-webkit-scrollbar{width:3px;}
.sb::-webkit-scrollbar-thumb{background:var(--bor);border-radius:3px;}
/* TOPBAR */
.topbar{height:var(--top);background:var(--sur);display:flex;align-items:center;padding:0 12px;gap:8px;
  border-bottom:1.5px solid var(--bor);z-index:10;flex-shrink:0;box-shadow:0 2px 8px rgba(91,142,240,.06);}
.bk{width:36px;height:36px;border-radius:50%;background:var(--s2);display:flex;align-items:center;
  justify-content:center;cursor:pointer;flex-shrink:0;border:none;transition:background .15s;font-size:18px;}
.bk:active{background:var(--bor);}
.tw{flex:1;min-width:0;}
.ttl{font-family:var(--fdi);font-size:13px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sub{font-size:11px;color:var(--t2);margin-top:1px;}
.ib{width:36px;height:36px;border-radius:50%;background:transparent;display:flex;align-items:center;
  justify-content:center;cursor:pointer;border:none;flex-shrink:0;transition:background .15s;font-size:18px;}
.ib:active{background:var(--s2);}
/* BOTTOM NAV */
.bnav{height:var(--nav);background:var(--sur);display:flex;align-items:stretch;
  border-top:1.5px solid var(--bor);flex-shrink:0;z-index:10;box-shadow:0 -2px 12px rgba(91,142,240,.07);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;gap:3px;color:var(--t3);border:none;background:transparent;position:relative;padding:6px 2px;transition:color .15s;}
.ni.act{color:var(--pri);}
.ni-icon{font-size:20px;line-height:1;}
.ni-lbl{font-size:9px;font-weight:800;letter-spacing:.3px;}
.nbdg{position:absolute;top:5px;right:calc(50% - 20px);background:var(--dan);color:#fff;
  font-size:9px;font-weight:800;border-radius:20px;padding:1px 5px;min-width:16px;text-align:center;}
/* AUTH */
.auth-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 40px;gap:6px;}
.auth-logo{font-size:60px;margin-bottom:4px;}
.auth-app{font-family:var(--fdi);font-size:26px;font-weight:700;}
.auth-city{font-size:13px;color:var(--t2);margin-bottom:16px;}
.auth-card{background:var(--sur);border-radius:var(--r);padding:22px;width:100%;max-width:360px;box-shadow:var(--sh2);}
.auth-card-ttl{font-size:15px;font-weight:800;margin-bottom:12px;}
.auth-inp{width:100%;background:var(--s2);border:2px solid var(--bor);outline:none;border-radius:var(--rsm);
  padding:13px 16px;font-family:var(--font);font-size:16px;color:var(--tx);letter-spacing:2px;font-weight:700;
  text-transform:uppercase;transition:border-color .2s;}
.auth-inp:focus{border-color:var(--pri);}
.auth-inp::placeholder{letter-spacing:0;font-weight:400;color:var(--t3);}
.auth-err{color:var(--dan);font-size:13px;font-weight:700;margin-top:8px;text-align:center;}
.demo-hint{background:var(--s2);border-radius:var(--rsm);padding:12px;width:100%;max-width:360px;margin-top:6px;}
.demo-hint-ttl{font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
.demo-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;cursor:pointer;}
.demo-code{font-family:monospace;font-size:13px;font-weight:800;color:var(--pri);letter-spacing:1px;}
.demo-role{font-size:12px;color:var(--t2);}
/* FORMS */
.fl{font-size:11px;font-weight:800;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;display:block;}
.fi{width:100%;background:var(--s2);border:2px solid var(--bor);outline:none;border-radius:var(--rsm);
  padding:11px 13px;font-family:var(--font);font-size:14px;color:var(--tx);transition:border-color .2s;margin-bottom:10px;}
.fi:focus{border-color:var(--pri);}
.fi:disabled{opacity:.55;cursor:not-allowed;}
.fta{width:100%;background:var(--s2);border:2px solid var(--bor);outline:none;border-radius:var(--rsm);
  padding:11px 13px;font-family:var(--font);font-size:14px;color:var(--tx);resize:none;min-height:80px;
  transition:border-color .2s;margin-bottom:10px;}
.fta:focus{border-color:var(--pri);}
.sel-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.chip{padding:7px 14px;border-radius:30px;border:2px solid var(--bor);background:var(--sur);
  font-family:var(--font);font-size:13px;font-weight:700;color:var(--t2);cursor:pointer;transition:all .15s;}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.chip:active{transform:scale(.95);}
.btn{background:var(--pri);color:#fff;border:none;border-radius:var(--rsm);padding:14px;
  font-family:var(--font);font-size:15px;font-weight:800;cursor:pointer;width:100%;
  transition:all .12s;box-shadow:0 4px 16px rgba(91,142,240,.3);margin-top:4px;}
.btn:active{transform:scale(.98);background:var(--pda);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn2{background:var(--s2);color:var(--tx);border:none;border-radius:var(--rsm);padding:12px;
  font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:all .12s;margin-top:4px;}
.btn2:active{background:var(--bor);}
.btnd{background:var(--dan);color:#fff;border:none;border-radius:var(--rsm);padding:10px 16px;
  font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:all .12s;}
.shdr{padding:10px 14px 4px;font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;}
/* STORIES */
.stories-bar{display:flex;gap:12px;padding:12px 14px;background:var(--sur);border-bottom:1.5px solid var(--bor);overflow-x:auto;flex-shrink:0;}
.stories-bar::-webkit-scrollbar{display:none;}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;}
.story-ring{width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--pri),#F5A623,#E74C3C);position:relative;}
.story-ring.seen{background:var(--bor);}
.story-ring.add{background:var(--pli);border:2px dashed var(--pri);}
.story-av{width:100%;height:100%;border-radius:50%;background:var(--sur);display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--sur);}
.story-name{font-size:10px;font-weight:700;color:var(--t2);max-width:56px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* CHAT CARD */
.cc{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--sur);
  cursor:pointer;border-bottom:1px solid var(--bor);transition:background .12s;}
.cc:active,.cc:hover{background:var(--pli);}
.cc.pin{border-left:3px solid var(--pri);}
.av{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--pri),#7B6EF6);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 2px 8px rgba(91,142,240,.18);}
.av.grn{background:linear-gradient(135deg,var(--grn),#2EA880);}
.av.ora{background:linear-gradient(135deg,var(--acc),#F07C23);}
.av.vio{background:linear-gradient(135deg,var(--vio),#7B6EF6);}
.av.red{background:linear-gradient(135deg,#E74C3C,var(--dan));}
.av.blu{background:linear-gradient(135deg,#3498DB,#2980B9);}
.av.tel{background:linear-gradient(135deg,#1ABC9C,#16A085);}
.av.sm{width:38px;height:38px;border-radius:11px;font-size:17px;}
.av.xs{width:28px;height:28px;border-radius:9px;font-size:14px;}
.ci{flex:1;min-width:0;}
.cn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;}
.cl{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;margin-top:2px;}
.cm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.ct{font-size:11px;color:var(--t3);}
.cmemb{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--t3);}
.ubdg{background:var(--pri);color:#fff;font-size:11px;font-weight:800;border-radius:20px;padding:2px 7px;min-width:20px;text-align:center;}
.pchip{background:var(--pli);color:var(--pri);font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;}
.rochip{background:#FFF3E0;color:#E65100;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;}
/* MESSAGES */
.ma{flex:1;overflow-y:auto;padding:10px 12px 4px;display:flex;flex-direction:column;gap:5px;}
.ma::-webkit-scrollbar{width:3px;}
.ma::-webkit-scrollbar-thumb{background:var(--bor);border-radius:3px;}
.dsep{text-align:center;margin:6px 0;}
.dsep span{background:rgba(91,142,240,.1);color:var(--t2);font-size:11px;font-weight:700;border-radius:20px;padding:3px 12px;}
.mw{display:flex;flex-direction:column;max-width:82%;}
.mw.me{align-self:flex-end;align-items:flex-end;}
.mw.ot{align-self:flex-start;align-items:flex-start;}
.msender{font-size:11px;font-weight:800;color:var(--pri);margin-bottom:2px;padding:0 4px;}
.mb{border-radius:18px;padding:9px 13px;font-size:14px;line-height:1.5;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.07);}
.mb.me{background:var(--pri);color:#fff;border-bottom-right-radius:5px;}
.mb.ot{background:var(--sur);color:var(--tx);border-bottom-left-radius:5px;}
.tme{font-size:10px;color:rgba(255,255,255,.65);margin-left:8px;display:inline-block;vertical-align:bottom;}
.tot{font-size:10px;color:var(--t3);margin-top:3px;padding:0 4px;}
.rsnip{background:rgba(91,142,240,.1);border-left:3px solid var(--pri);border-radius:10px;padding:5px 8px;margin-bottom:5px;}
.rsnip-n{font-size:11px;font-weight:800;color:var(--pri);}
.rsnip-t{font-size:12px;color:var(--t2);margin-top:1px;}
.fwdsnip{background:rgba(52,192,160,.1);border-left:3px solid var(--grn);border-radius:10px;padding:5px 8px;margin-bottom:5px;font-size:12px;color:var(--t2);}
.reacts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.rbtn{background:var(--sur);border:1.5px solid var(--bor);border-radius:20px;padding:3px 8px;
  font-size:13px;cursor:pointer;display:flex;align-items:center;gap:3px;transition:all .12s;}
.rbtn:active{transform:scale(1.15);}
.rbtn.on{background:var(--pli);border-color:var(--pri);}
.rcnt{font-size:11px;color:var(--t2);font-weight:700;}
.pbar{background:var(--pli);border-bottom:1.5px solid var(--bor);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.pbar-t{font-size:12px;color:var(--pri);font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* CHAT INPUT */
.ciw{background:var(--sur);border-top:1.5px solid var(--bor);padding:10px 12px;display:flex;align-items:flex-end;gap:8px;flex-shrink:0;}
.rbar{background:var(--pli);border-top:2px solid var(--pri);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.rbar-t{flex:1;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rcl{background:none;border:none;font-size:20px;color:var(--t3);cursor:pointer;line-height:1;}
.atb{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:var(--s2);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:all .12s;}
.atb:active{background:var(--bor);}
.snd{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:var(--pri);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:all .12s;}
.snd:active{background:var(--pda);transform:scale(.95);}
.mi{flex:1;background:var(--s2);border:none;outline:none;border-radius:20px;padding:10px 14px;
  font-family:var(--font);font-size:14px;color:var(--tx);resize:none;max-height:100px;line-height:1.4;}
.mi::placeholder{color:var(--t3);}
.cro{background:var(--s2);border-top:1.5px solid var(--bor);padding:14px;text-align:center;font-size:13px;color:var(--t3);flex-shrink:0;}
.cpb{background:var(--sur);border-top:1.5px solid var(--bor);padding:10px 14px;flex-shrink:0;}
/* COMMENTS */
.cmts{border-top:1px solid var(--bor);margin-top:8px;padding-top:8px;}
.cmt{display:flex;gap:8px;margin-bottom:7px;}
.cmt-bub{background:var(--s2);border-radius:13px;padding:7px 11px;flex:1;}
.cmt-n{font-size:11px;font-weight:800;color:var(--pri);}
.cmt-t{font-size:13px;color:var(--tx);margin-top:2px;line-height:1.4;}
.cmt-tm{font-size:10px;color:var(--t3);margin-top:2px;}
.cmttog{font-size:12px;font-weight:700;color:var(--pri);cursor:pointer;margin-top:5px;display:flex;align-items:center;gap:4px;}
.cmt-ir{display:flex;gap:8px;margin-top:8px;align-items:center;}
.cmt-in{flex:1;background:var(--s2);border:none;outline:none;border-radius:13px;padding:8px 12px;font-family:var(--font);font-size:13px;color:var(--tx);}
.cmt-snd{width:32px;height:32px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;}
/* NEWS */
.npost{margin:10px 14px;background:var(--sur);border-radius:var(--r);padding:16px;box-shadow:var(--sh);}
.ntag{display:inline-block;background:var(--pli);color:var(--pri);font-size:10px;font-weight:800;border-radius:6px;padding:2px 8px;margin-bottom:8px;}
.nbod{font-size:14px;color:var(--tx);line-height:1.6;}
.nmeta{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.nauth{font-size:11px;color:var(--t3);font-weight:600;}
.ndate{font-size:11px;color:var(--t3);}
.nacts{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;}
.nrb{display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;
  background:var(--s2);border:none;border-radius:20px;padding:5px 10px;font-family:var(--font);transition:all .12s;}
.nrb:active{transform:scale(.95);}
.nrb.on{background:var(--pli);}
/* HW */
.hwc{margin:8px 14px;background:var(--sur);border-radius:var(--r);padding:13px 14px;
  box-shadow:var(--sh);display:flex;align-items:flex-start;gap:11px;}
.hwi{width:42px;height:42px;border-radius:12px;background:var(--pli);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.hwinf{flex:1;min-width:0;}
.hwsub{font-size:14px;font-weight:800;}
.hwcls{font-size:11px;color:var(--pri);font-weight:700;margin-bottom:2px;}
.hwtsk{font-size:13px;color:var(--t2);margin-top:2px;line-height:1.4;}
.hwmet{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap;}
.hwdue{font-size:11px;font-weight:700;}
.hwdue.sn{color:var(--dan);}
.hwdue.ok{color:var(--grn);}
.hwte{font-size:11px;color:var(--t3);}
.hwchk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bor);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;font-size:13px;color:transparent;}
.hwchk.dn{background:var(--grn);border-color:var(--grn);color:#fff;}
/* PROFILE */
.phero{background:linear-gradient(135deg,var(--pri),#7B6EF6);padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.pav{width:84px;height:84px;border-radius:26px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:40px;border:3px solid rgba(255,255,255,.4);cursor:pointer;}
.pnm{font-family:var(--fdi);font-size:17px;color:#fff;font-weight:700;text-align:center;}
.prchip{background:rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:800;border-radius:20px;padding:4px 14px;}
.pbio{font-size:13px;color:rgba(255,255,255,.75);text-align:center;max-width:260px;line-height:1.4;}
.pcard{background:var(--sur);border-radius:var(--r);margin:10px 14px 0;overflow:hidden;box-shadow:var(--sh);}
.prow{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--bor);}
.prow:last-child{border-bottom:none;}
.pric{font-size:18px;width:26px;text-align:center;flex-shrink:0;}
.prinf{flex:1;min-width:0;}
.prlb{font-size:11px;color:var(--t3);font-weight:700;}
.prvl{font-size:14px;font-weight:600;color:var(--tx);margin-top:1px;}
.prow.cl{cursor:pointer;}
.prow.cl:active{background:var(--s2);}
.prow.dng .prlb{color:var(--dan);}
.gtag{display:inline-block;background:var(--pli);color:var(--pri);font-size:12px;font-weight:700;border-radius:8px;padding:3px 10px;margin:2px;}
/* CODE */
.cres{background:var(--pli);border-radius:var(--rsm);padding:16px;margin-bottom:14px;text-align:center;}
.cres-c{font-family:monospace;font-size:26px;font-weight:800;color:var(--pri);letter-spacing:4px;}
.cres-i{font-size:12px;color:var(--t2);margin-top:5px;}
.cli{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--bor);background:var(--sur);}
.cbdg{font-family:monospace;font-size:13px;font-weight:800;color:var(--pri);background:var(--pli);border-radius:8px;padding:3px 9px;letter-spacing:1px;flex-shrink:0;}
.cinf{flex:1;min-width:0;}
.crn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmt2{font-size:11px;color:var(--t3);margin-top:1px;}
.cus.yes{font-size:11px;font-weight:700;color:var(--t3);}
.cus.no{font-size:11px;font-weight:700;color:var(--grn);}
/* ADMIN */
.adm-sec{margin:10px 14px 0;}
.adm-ttl{font-size:13px;font-weight:800;color:var(--tx);margin-bottom:7px;}
.adm-ui{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--sur);border-bottom:1px solid var(--bor);}
.adm-nm{font-size:14px;font-weight:700;}
.adm-me{font-size:12px;color:var(--t2);}
/* DM */
.dm-list{display:flex;flex-direction:column;}
/* MODAL */
.mbd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;}
.mbd.op{display:block;}
.modal{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;
  background:var(--sur);border-radius:var(--r) var(--r) 0 0;z-index:201;
  transition:transform .28s cubic-bezier(.34,1.3,.64,1);max-height:90vh;overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom,16px);}
.modal.op{transform:translateX(-50%) translateY(0);}
.mhan{width:44px;height:4px;background:var(--bor);border-radius:2px;margin:12px auto 14px;}
.mttl{font-size:17px;font-weight:800;padding:0 20px 12px;border-bottom:1px solid var(--bor);}
.mbod{padding:14px 20px 18px;}
/* STORY VIEW */
.sv-bg{position:fixed;inset:0;background:#000;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.sv-close{position:absolute;top:16px;right:16px;font-size:28px;cursor:pointer;color:#fff;background:none;border:none;}
.sv-card{background:var(--s2);border-radius:24px;padding:32px 24px;width:88%;max-width:340px;text-align:center;}
.sv-av{font-size:64px;margin-bottom:12px;}
.sv-name{font-family:var(--fdi);font-size:16px;font-weight:700;color:var(--tx);margin-bottom:8px;}
.sv-text{font-size:16px;color:var(--tx);line-height:1.6;}
.sv-time{font-size:12px;color:var(--t3);margin-top:12px;}
/* CTX */
.ctx{position:fixed;background:var(--sur);border-radius:var(--rsm);box-shadow:var(--sh2);padding:6px 0;z-index:300;min-width:180px;display:none;}
.ctx.op{display:block;}
.cxi{padding:11px 16px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .1s;}
.cxi:active{background:var(--s2);}
.cxi.dng{color:var(--dan);}
/* ATTACH */
.ash{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;
  background:var(--sur);border-radius:var(--r) var(--r) 0 0;padding:16px 16px 32px;z-index:201;
  transition:transform .25s cubic-bezier(.34,1.3,.64,1);}
.ash.op{transform:translateX(-50%) translateY(0);}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:12px;}
.aopt{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.aopt-ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;}
.aopt-lb{font-size:11px;font-weight:700;color:var(--t2);}
/* OVERLAY */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:190;display:none;}
.ov.op{display:block;}
/* TOAST */
.toast{position:fixed;bottom:calc(var(--nav) + 14px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--tx);color:#fff;font-size:13px;font-weight:700;border-radius:20px;
  padding:10px 20px;z-index:400;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;}
.toast.sh{opacity:1;transform:translateX(-50%) translateY(0);}
/* EMPTY */
.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 24px;gap:10px;}
.emp-ic{font-size:48px;opacity:.3;}
.emp-t{font-size:14px;color:var(--t3);text-align:center;font-weight:600;max-width:220px;line-height:1.5;}
/* TOGGLE */
.tog{width:44px;height:24px;border-radius:12px;background:var(--bor);position:relative;cursor:pointer;transition:background .2s;border:none;flex-shrink:0;}
.tog.on{background:var(--grn);}
.tog::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tog.on::after{left:23px;}
/* FAB */
.fab{position:fixed;bottom:calc(var(--nav) + 14px);right:16px;width:52px;height:52px;border-radius:50%;
  background:var(--pri);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;
  font-size:26px;color:#fff;box-shadow:0 4px 20px rgba(91,142,240,.45);transition:transform .15s;z-index:50;line-height:1;}
.fab:active{transform:scale(.93);}
.fab.show{display:flex;}
/* ONLINE DOT */
.odot{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:#2DCE89;border:2px solid var(--sur);}
/* READ CHECK */
.rchk{font-size:10px;margin-left:4px;color:rgba(255,255,255,.7);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.cc,.npost,.hwc{animation:fadeUp .22s ease backwards;}
</style>
</head>

function cu(){
  if(!S.currentUserId)return null;
  if(S.currentUserId==='admin')return{id:'admin',name:'',surname:'',role:'admin',grades:[{grade:null,letter:null}],dob:'',emoji:'🛡️',bio:'Системный администратор'};
  return S.users.find(u=>u.id===S.currentUserId)||null;
}
function isAdmin(u){return u&&u.role==='admin';}
function isStaff(u){return u&&(RANK[u.role]||0)>=3;}
function rk(u){return u?(RANK[u.role]||0):0;}
function uGrades(u){return u?(u.grades||[{grade:u.grade,letter:u.letter}]):[]; }
// ══ ACCESS ══
function canSee(u,c){
  if(!u)return false;
  if(isStaff(u)||isAdmin(u))return true;
  if(c.type==='channel'||c.type==='dm_admin')return true;
  if(c.type==='dm'){const ms=c.members||[];return ms.includes(u.id);}
  const gs=uGrades(u);const match=gs.some(g=>g.grade===c.grade&&g.letter===c.letter);
  if(c.type==='students')return match;
  if(c.type==='parents')return match&&u.role==='parent';
  if(c.type==='group')return(c.members||[]).includes(u.id);
  return false;
}
function canPost(u,c){
  if(!u)return false;
  if(isAdmin(u))return true;
  if(c.type==='channel')return isStaff(u);
  if(c.type==='dm_admin')return true;
  if(c.type==='dm')return(c.members||[]).includes(u.id);
  if(c.type==='students')return u.role==='student'||isStaff(u);
  if(c.type==='parents')return u.role==='parent'||isStaff(u);
  if(c.type==='group')return true;
  return isStaff(u);
}
function visChats(u){return S.chats.filter(c=>canSee(u,c));}

  chats.filter(c=>!c.pinned).forEach(c=>{
    let sec=c.type==='dm'?'Личные сообщения':c.type==='dm_admin'?'Служебные':c.grade?(c.grade+' класс'):'Другое';

function buildMsg(msg,cid,u){
  const isMe=msg.fromId===u.id||(isAdmin(u)&&msg.fromId==='sys');
  const chat=S.chats.find(c=>c.id===cid);
  const isCh=chat&&chat.type==='channel';
  const wrap=ce('div');wrap.className='mw '+(isMe?'me':'ot');wrap.dataset.id=msg.id;
  if(!isMe){const sn=ce('div');sn.className='msender';sn.textContent=msg.from;wrap.appendChild(sn);}
  if(msg.replyTo){const rs=ce('div');rs.className='rsnip';const rn=ce('div');rn.className='rsnip-n';rn.textContent=msg.replyTo.from;const rt=ce('div');rt.className='rsnip-t';rt.textContent=(msg.replyTo.text||'').slice(0,60);rs.appendChild(rn);rs.appendChild(rt);wrap.appendChild(rs);}
  if(msg.fwd){const fw=ce('div');fw.className='fwdsnip';fw.textContent='↗ Переслано от '+msg.fwd;wrap.appendChild(fw);}
  const bub=ce('div');bub.className='mb '+(isMe?'me':'ot');
  const tx=ce('span');tx.textContent=msg.text;bub.appendChild(tx);
  if(isMe){const ti=ce('span');ti.className='tme';ti.textContent=' '+msg.time;bub.appendChild(ti);if(msg.read){const rc=ce('span');rc.className='rchk';rc.textContent='✓✓';bub.appendChild(rc);}}
  let ltimer;
  bub.addEventListener('touchstart',e=>{ltimer=setTimeout(()=>openCtx(e.touches[0],msg,cid),550);},{passive:true});
  bub.addEventListener('touchend',()=>clearTimeout(ltimer));
  bub.addEventListener('touchmove',()=>clearTimeout(ltimer));

function toggleR(cid,mid,e){
  const u=cu();const msgs=S.msg[cid];if(!msgs)return;
  const msg=msgs.find(m=>m.id===mid);if(!msg)return;
  if(!msg.r)msg.r=[];let r=msg.r.find(x=>x.e===e);
  if(!r){r={e,n:0,v:[]};msg.r.push(r);}
  if(!r.v)r.v=[];
  const uid=u.id||'admin';
  if(r.v.includes(uid)){r.v=r.v.filter(x=>x!==uid);r.n=Math.max(0,r.n-1);}
  else{r.v.push(uid);r.n++;}
  saveState();renderMsgs(cid);setTimeout(()=>{const a=document.getElementById('msgsArea');a.scrollTop=a.scrollHeight;},20);
}
function sendMsg(){
  const u=cu();if(!u||!currentChatId)return;
  const chat=S.chats.find(c=>c.id===currentChatId);if(!chat)return;
  if(!canPost(u,chat)){showToast('Нет прав для отправки');return;}
  const inp=document.getElementById('msgInp');const text=inp.value.trim();if(!text)return;

  if(replyMsg){m.replyTo={from:replyMsg.from,text:replyMsg.text};cancelReply();}
  if(!S.msg[currentChatId])S.msg[currentChatId]=[];
  S.msg[currentChatId].push(m);

function renderHW(){
  const u=cu();const list=document.getElementById('hwList');list.innerHTML='';
  if(!u)return;
  let items=S.hw;
  if(u.role==='student'||u.role==='parent'){
    const gs=uGrades(u);items=items.filter(h=>gs.some(g=>g.grade===h.grade&&g.letter===h.letter));
  }
  if(!items.length){addEmp(list,'📚','Нет заданий'+(u.role==='student'?' для вашего класса':''));return;}
  const now2=new Date();now2.setHours(0,0,0,0);
  items=items.slice().sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate));
  let prevSec='';
  items.forEach((hw,i)=>{
    const due=new Date(hw.dueDate);due.setHours(0,0,0,0);
    const dl=Math.round((due-now2)/(864e5));
    const sec=dl<0?'🔴 Просроченные':dl===0?'🟡 Сдать сегодня':dl===1?'🟡 Сдать завтра':'🟢 Предстоящие';
    if(sec!==prevSec){aSHdr(list,sec);prevSec=sec;}
    const card=ce('div');card.className='hwc';card.style.animationDelay=(i*.05)+'s';
    const icon=ce('div');icon.className='hwi';icon.textContent=Semoji[hw.subject]||'📝';card.appendChild(icon);

    const sub=ce('div');sub.className='hwsub';sub.textContent=hw.subject;
    const cls=ce('div');cls.className='hwcls';cls.textContent=hw.grade+hw.letter;
    const tsk=ce('div');tsk.className='hwtsk';tsk.textContent=hw.text;
    const met=ce('div');met.className='hwmet';
    const due2=ce('div');due2.className='hwdue '+(dl<=1?'sn':'ok');due2.textContent=dl<0?'⚠️ Просрочено':dl===0?'📅 Сегодня':dl===1?'📅 Завтра':'📅 '+hw.dueDate.split('-').reverse().join('.');
    const te=ce('div');te.className='hwte';te.textContent=hw.teacher;
    met.appendChild(due2);met.appendChild(te);
    inf.appendChild(sub);if(isStaff(u)||isAdmin(u))inf.appendChild(cls);inf.appendChild(tsk);inf.appendChild(met);card.appendChild(inf);
    if(u.role==='student'){
      const chk=ce('div');chk.className='hwchk'+((S.hwDone[u.id]||{})[hw.id]?' dn':'');chk.textContent=(S.hwDone[u.id]||{})[hw.id]?'✓':'';

      card.appendChild(chk);
      const fb=ce('button');fb.style.cssText='background:none;border:none;font-size:18px;cursor:pointer;padding:0 4px;';fb.textContent='↗️';
      fb.onclick=e=>{e.stopPropagation();openFwd({from:'ДЗ',text:hw.subject+': '+hw.text});};card.appendChild(fb);
    }
    if(isStaff(u)||isAdmin(u)){
      const db=ce('button');db.style.cssText='background:none;border:none;font-size:18px;cursor:pointer;padding:0 4px;';db.textContent='🗑️';
      db.onclick=e=>{e.stopPropagation();S.hw=S.hw.filter(h=>h.id!==hw.id);saveState();renderHW();showToast('Задание удалено');};

  const ttl=ce('div');ttl.className='mttl';ttl.textContent=title;mc.appendChild(ttl);
  const bod=ce('div');bod.className='mbod';fn(bod);mc.appendChild(bod);
  mbd.classList.add('op');modal.classList.add('op');
}
function closeModal(){document.getElementById('mbd').classList.remove('op');document.getElementById('modal').classList.remove('op');}
// ══ ATTACH ══
function renderAttach(){
  const grid=document.getElementById('agrid');grid.innerHTML='';
  AOPT.forEach(opt=>{
    const item=ce('div');item.className='aopt';
    const ic=ce('div');ic.className='aopt-ic';ic.style.background=opt.b;ic.textContent=opt.i;
    const lb=ce('div');lb.className='aopt-lb';lb.textContent=opt.l;
    item.appendChild(ic);item.appendChild(lb);item.onclick=()=>{closeOverlays();showToast(opt.l+': скоро будет доступно');};
    grid.appendChild(item);
  });
}
function toggleAttach(){const ash=document.getElementById('ash');const ov=document.getElementById('ov');if(ash.classList.contains('op')){ash.classList.remove('op');ov.classList.remove('op');}else{ash.classList.add('op');ov.classList.add('op');}}
// ══ UTILS ══
function closeOverlays(){document.getElementById('ov').classList.remove('op');document.getElementById('ash').classList.remove('op');document.getElementById('ctx').classList.remove('op');}
let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('sh');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('sh'),2600);}
function updateBadge(){const tot=S.chats.reduce((s,c)=>s+(c.unread||0),0);const b=document.getElementById('ubdg');b.style.display=tot>0?'block':'none';b.textContent=tot>99?'99+':tot;}
function renderDemoCodes(){const c=document.getElementById('demoCodes');c.innerHTML='';DEMO.forEach(d=>{const row=ce('div');row.className='demo-row';const code=ce('span');code.className='demo-code';code.textContent=d.code;const role=ce('span');role.className='demo-role';role.textContent=d.desc;row.appendChild(code);row.appendChild(role);row.onclick=()=>{document.getElementById('authInp').value=d.code;};c.appendChild(row);});}
// ══ INIT ══
document.addEventListener('DOMContentLoaded',()=>{
  loadState();
  if(!S.chats||!S.chats.length||!S.codes||!S.codes.length)seed();
  // Ensure msg keys exist for all chats
  S.chats.forEach(c=>{if(!S.msg[c.id])S.msg[c.id]=[];});
  saveState();
  renderDemoCodes();renderAttach();
  if(S.currentUserId){enterApp();}else{openScreen('screen-auth');}
});
// Globals for HTML onclick
window.doAuth=doAuth;window.toggleSearch=toggleSearch;window.renderChats=renderChats;window.closeChat=closeChat;window.cancelReply=cancelReply;window.sendMsg=sendMsg;window.msgKd=msgKd;window.autoResize=autoResize;window.toggleAttach=toggleAttach;window.closeOverlays=closeOverlays;window.closeModal=closeModal;window.openCreatePostModal=openCreatePostModal;window.showChatInfo=showChatInfo;window.openScreen=openScreen;window.switchTab=switchTab;window.openAdminScreen=openAdminScreen;window.closeStoryView=closeStoryView;window.renderHWCreate=renderHWCreate;window.renderCreateGroup=renderCreateGroup;
</script>
</body>
</html>
